---
layout: default
---
<div class="page-head">
  <div class="container">
    <h1 class="page-head__title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page-head__subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="page-body">
  <div class="container">
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</div>
