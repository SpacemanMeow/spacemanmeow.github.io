---
layout: default
---
<div class="page-head">
  <div class="container">
    <h1 class="page-head__title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page-head__subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="blog-list">
  {%- for post in paginator.posts %}
    <div class="blog-row">
      <div class="container">
        {% include post-card.html post=post %}
      </div>
    </div>
  {%- else %}
    <div class="blog-row">
      <div class="container">
        <p class="empty-tip">No posts yet.</p>
      </div>
    </div>
  {%- endfor %}
</div>

<div class="container">
  {% include pagination.html %}
</div>
