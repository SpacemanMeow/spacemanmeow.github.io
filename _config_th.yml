  app_store: https://apps.apple.com/us/developer/%E5%A2%83-%E9%AB%98/id1528847758

collections:
  pages:
    output: true
    path: _pages/th
    permalink: /th/:name/
  # 中文应用放在独立集合 apps_th（源目录 _apps_th），与英文 apps 集合（源目录 _apps）完全分离。
  # 原因：Jekyll 的集合始终从 _#{label} 目录递归读取，且 collections.*.path 对读取目录无效；
  # 若复用 apps 集合，英文 _apps/*.md 也会被 ZH 构建读到并映射到 /th/apps/ 下与中文档冲突。
  # 因此中文应用使用 apps_th 集合（目录 _apps_th），英文 _apps/ 在 ZH 构建中不再定义 apps 集合。
  apps_th:
    output: true
    path: _apps_th
    permalink: /th/apps/:name/
  glossary_th:
    output: true
    path: _glossary_th
    permalink: /th/glossary/:name/
  posts:
    output: true
    path: _posts/th
    permalink: /th/posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /th/posts/:title/
      nav: blog
  - scope:
      path: ""
      type: apps_th
    values:
      layout: app
      nav: home
      seo:
        type: WebPage

paginate: 10
paginate_path: /th/blog/page:num

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: th/feed.xml

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

# 输出到主站 _site/th/ 子目录，与英文根目录合并部署
destination: _site/th

# 排除英文根级源文件与静态文件，避免重复生成到 /th/ 下。
# Jekyll 的集合始终从 _#{label} 目录递归读取（与 collections.*.path 无关），
# 因此 EN 源目录 _apps/_pages/_posts 与中文源 _pages/zh、_posts/zh 会在各自构建中被一同读到。
# 处理策略：
#   - apps：中文应用已独立为 apps_th 集合（源 _apps_th），英文 _apps 在 ZH 构建不再定义 apps 集合，
#           这里显式排除 _apps/（注意带尾斜杠，避免误伤同前缀的 _apps_th 中文源目录）以防万一被误读。
#   - posts：英文文章为日期文件（_posts/YYYY-MM-DD-*.md），均为 _posts 的直接子项；
#            用 "_posts/2*" / "_posts/1*" 通配可精确排除英文根级文章，而不会误伤 _posts/th/ 下的中文文章
#            （_posts/th/... 在 _posts/ 之后是 "zh/..."，不匹配数字前缀）。新增英文文章会自动生效。
#   - pages：英文 _pages/*.md 均带显式 permalink（/about/ 等），在 ZH 构建中映射到根目录而非 /th/，
#            不会与中文页冲突，也未被 rsync 进 _site/th，故无需排除。
# 注意：字符串通配符 * 在 Jekyll 的 fnmatch 中不带 FNM_PATHNAME，会跨 / 匹配，
#       因此无法用 "_posts/*" 区分直接子项与 _posts/th/ 子项，须用上述前缀/目录排除法。
exclude:
  - _apps_ms
  - _apps_ms/**
  - _glossary_ms
  - _glossary_ms/**
  - _pages/ms
  - _pages/ms/**
  - _posts/ms
  - _posts/ms/**
  - ms/
  - ms/**
  - _apps_zh
  - _apps_zh/**
  - _glossary_zh
  - _glossary_zh/**
  - _pages/zh
  - _pages/zh/**
  - _posts/zh
  - _posts/zh/**
  - zh/
  - zh/**
  - _apps_id
  - _apps_id/**
  - _glossary_id
  - _glossary_id/**
  - _pages/id
  - _pages/id/**
  - _posts/id
  - _posts/id/**
  - id/
  - id/**
  - _apps/
  - _glossary/
  - _glossary/**
  - _posts/2*
  - _posts/1*
  - index.html
  - blog/
  - meow/
  - robots.txt
  - CNAME
  - app-ads.txt
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - seo/
  - "seo/**"
  - README.md
  - SEO-OPTIMIZATION-PLAN.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .devcontainer
  - .idea
  - .vscode
  - .qoder
  - 404.html
