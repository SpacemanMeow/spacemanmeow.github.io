# ===================================================================
#  Meow Apps Studio - 泰语站配置（Thai / ไทย）
#  独立配置（不再依赖 _config.yml 合并），与英文站并列构建：
#    bundle exec jekyll build --config _config_th.yml   -> 输出到 _site/th/
#  泰语源文件：_posts/th/、_pages/th/、_apps/th/
#  英文站：bundle exec jekyll build --config _config.yml -> 输出到 _site/
#  合并构建：scripts/build.sh（先 EN 后各语言，再注入 hreflang + 合并 sitemap）
# ===================================================================

lang: th
timezone: Asia/Bangkok

title: Meow Apps Studio
tagline: "แอปพลิเคชันมือถือที่สวยงามและหรูหรา"
description: >-
  เรามุ่งมั่นสร้างแอปพลิเคชันสำหรับ iOS และ Android ที่งดงามและทรงคุณภาพ
  เราได้เปิดตัวแอปคุณภาพสูงที่ผู้ใช้นิยมหลายตัว ขอบคุณที่สนใจ และการสนับสนุนของคุณคือแรงผลักดันสำคัญที่ทำให้เราก้าวต่อไป

url: "https://spacemanmeow.com"
baseurl: ""

avatar: /assets/images/favicons/avatar.png
