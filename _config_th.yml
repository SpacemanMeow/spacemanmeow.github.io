      url: mailto:meow@spacemanmeow.com

webmaster_verifications:
  google: MvOa_RCgbYDbkyWz1nce7QzlFS30B4RYjBNLI43eHjU
  bing: 3696BDF54B98CDFFA525A706AC915374
  yandex: 7b7f2662239dd86d

goatcounter_code: "spacemanmeow"

developer:
  title: หน้านักพัฒนา
  logo: /assets/images/favicons/avatar.png
  description: >-
    เรามุ่งมั่นสร้างแอปพลิเคชันสำหรับ iOS และ Android ที่งดงามและทรงคุณภาพ
    เราได้เปิดตัวแอปคุณภาพสูงที่ผู้ใช้นิยมหลายตัว ขอบคุณที่สนใจ และการสนับสนุนของคุณคือแรงผลักดันสำคัญที่ทำให้เราก้าวต่อไป
