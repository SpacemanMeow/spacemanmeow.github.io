# ===================================================================
#  Meow Apps Studio - 官方网站配置
# ===================================================================

# 站点语言 / 时区
lang: en
timezone: Asia/Shanghai

# -------------------------------------------------------------------
# 基本信息（会显示在导航栏、页脚、SEO 标签中）
# -------------------------------------------------------------------
title: Meow Apps Studio
tagline: Focus on creating beautiful and elegant applications.
description: >-
  We are committed to creating aesthetically pleasing and powerful mobile applications
  for both iOS and Android platforms. We have already launched a number of outstanding
  applications, and we truly appreciate your attention. Your support is our greatest
  motivation to keep moving forward.

# 站点地址（末尾不要加 /）
url: "https://spacemanmeow.github.io"
baseurl: ""

# 头像 / 站点图标
avatar: /assets/images/favicons/avatar.png
favicon: /assets/images/favicons/favicon-96x96.jpg
apple_touch_icon: /assets/images/favicons/apple-touch-icon.jpg

# SEO / 社交信息（footer 底部显示的链接）
social:
  name: SpacemanMeow
  email: meow@spacemanmeow.com
  links:
    - name: Privacy Policy
      url: /privacy/
    - name: Terms of Use
      url: /terms/
    - name: Email
      url: mailto:meow@spacemanmeow.com

# 站点验证（可选）
webmaster_verifications:
  google: MvOa_RCgbYDbkyWz1nce7QzlFS30B4RYjBNLI43eHjU
  bing: 3696BDF54B98CDFFA525A706AC915374
  yandex: 7b7f2662239dd86d

# -------------------------------------------------------------------
# 所有页面底部的 Developer Page（开发者页脚）
# -------------------------------------------------------------------
developer:
  title: Developer Page
  logo: /assets/images/favicons/avatar.png
  description: >-
    We are committed to creating aesthetically pleasing and powerful mobile applications
    for both iOS and Android platforms. We have already launched a number of outstanding
    applications, and we truly appreciate your attention. Your support is our greatest
    motivation to keep moving forward.
  # 开发者主页（点击页脚按钮跳转）。留空则不显示对应按钮。
  google_play: https://play.google.com/store/apps/dev?id=9089535463678444622
  app_store: https://apps.apple.com/us/developer/%E5%A2%83-%E9%AB%98/id1528847758

# -------------------------------------------------------------------
# 内容集合
# -------------------------------------------------------------------
collections:
  pages:
    output: true
    permalink: /:name/
  apps:
    output: true
    permalink: /apps/:name/

defaults:
  # 博客文章
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      nav: blog
  # 应用（_apps/*.md，一篇 = 一个应用 = 一个详情页）
  - scope:
      path: ""
      type: apps
    values:
      layout: app
      nav: home

# 博客分页
paginate: 10
paginate_path: "/blog/page:num"

# -------------------------------------------------------------------
# 插件
# -------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

# ------------ 以下为 Jekyll 内部配置，一般不需要修改 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .devcontainer
  - .idea
  - .vscode
  - .qoder
