th:
  one-widget:
    audience: "สำหรับผู้ใช้ Android ที่ต้องการวิดเจ็ตสำเร็จรูปในสไตล์ One UI, Material You, Glass iOS และ Nothing โดยไม่ต้องเรียนรู้ตัวแก้ไขวิดเจ็ต"
    usage: "เลือกสไตล์ ลากวิดเจ็ตไปหน้าจอหลัก ปรับขนาดจาก 1x1 ถึง 2x6 แล้วเพิ่มนาฬิกา ปฏิทิน แบตเตอรี่ RAM ปุ่มลัด หรือทางลัดแอป"
    free: "ชุดวิดเจ็ต One UI ใช้ฟรี ส่วนสไตล์ Glass iOS, Material You และ Nothing ต้องปลดล็อกแบบจ่ายครั้งเดียว"
    limits: "ใช้ได้เฉพาะ Android และปรับแต่งได้ภายในแม่แบบที่กำหนด ไม่ใช่ตัวแก้ไขอิสระแบบ KWGT"
  meow-todo-list:
    audience: "สำหรับผู้ใช้ Android และ iOS ที่ต้องการเก็บงานไว้ในเครื่องด้วยล็อกนิ้วมือ ไม่ใช่บัญชีคลาวด์อีกบัญชี"
    usage: "สร้างรายการและงาน เพิ่มงานย่อยและการแจ้งเตือน ดูแผนรายวัน รายสัปดาห์ หรือรายเดือน แล้วสำรองผ่าน Google Drive หรือ WebDAV"
    free: "รายการ งาน การแจ้งเตือน และมุมมองปฏิทินใช้ฟรี VIP เพิ่มรายการไม่จำกัด ป้ายกำกับ งานย่อย ส่งออก CSV และล็อกแอป"
    limits: "การสำรองทำด้วยตนเองผ่าน Google Drive หรือ WebDAV ไม่ใช่การซิงก์แบบเรียลไทม์ข้ามอุปกรณ์"
  meow-habits:
    audience: "สำหรับผู้ที่ต้องการสร้างหรือเลิกนิสัยประจำวันด้วยไอคอนน่ารัก ติดตามแบบออฟไลน์ และไม่ต้องมีบัญชี"
    usage: "สร้างนิสัยหลายรายการด้วยรอบรายวัน รายสัปดาห์ รายเดือน หรือกำหนดเอง เช็คอินทุกวัน ดู streak และกราฟ ตั้งการแจ้งเตือน และส่งออก CSV"
    free: "การติดตาม streak และกราฟใช้ฟรี VIP เพิ่มการส่งออก CSV และการปรับแต่งเพิ่มเติม"
    limits: "การส่งออก CSV อยู่หลัง VIP และไม่มีระบบ RPG หรือการฝึกด้านพฤติกรรม"
  cross-hair:
    audience: "สำหรับผู้เล่น FPS และเกมยิงปืนบน Android ที่ต้องการ crosshair แบบกำหนดเอง"
    usage: "เลือกจากมากกว่า 80 สไตล์ ปรับขนาด สี และตำแหน่ง ออกแบบให้สร้าง crosshair แม้อาวุธที่ไม่มี crosshair มาให้ก็ตาม"
    free: "สไตล์พื้นฐานใช้ฟรี สไตล์ขั้นสูงและพรีเมียมต้องซื้อเวอร์ชันโปร"
    limits: "ใช้ได้เฉพาะ Android และครอบคลุมเกม FPS และแอ็กชันยอดนิยมเกือบทั้งหมด ไม่รับประกันทุกเกม"
  meow-money-manager:
    audience: "สำหรับผู้ที่ให้ความสำคัญกับความเป็นส่วนตัวและต้องการจดรายจ่ายและงบประมาณด้วยตนเอง โดยไม่ต้องมีบัญชีหรือผูกธนาคาร"
    usage: "เพิ่มรายการด้วยตนเอง ตั้งงบประมาณตามหมวดหมู่ ติดตามการคืนเงิน ส่งออก CSV และสำรองไปยัง Google Drive หรือ WebDAV ของคุณเอง"
    free: "การจดรายจ่ายและงบประมาณหลักใช้ฟรี สมุดเล่มหลายเล่มและการส่งออก CSV ต้องปลดล็อก"
    limits: "ไม่เชื่อมธนาคารและไม่นำเข้าอัตโนมัติ ข้อมูลอยู่ในเครื่องจนกว่าคุณจะสำรอง"
  floating-assistant:
    audience: "สำหรับผู้ใช้ Android ที่ต้องการปุ่มเสมือน Home, Back, Recent และ Volume แบบลอยหน้าจอ โดยเฉพาะเมื่อปุ่มจริงไม่สะดวก"
    usage: "ใช้ลูกบอลลอยสำหรับนำทาง ปรับเสียง เร่งความเร็ว ล็อกหน้าจอ ภาพหน้าจอ ไฟฉาย เปิดแอปเร็ว นาฬิกาลอย และ monitoring CPU/RAM แบบเรียลไทม์"
    free: "ราคาปัจจุบันและการซื้อในแอปแสดงอยู่ในหน้าสโตร์"
    limits: "ใช้บริการ Accessibility เฉพาะการควบคุมที่ระบุ และไม่เก็บข้อมูลส่วนตัวหรือข้อมูลละเอียดอ่อน"
  meow-fm:
    audience: "สำหรับผู้ที่ต้องการเสียง white noise ช่วยนอนหลับ ผ่อนคลาย เรียน หรือโฟกัสในออฟฟิศ"
    usage: "เลือกเสียงฝน ฟ้าผ่า ป่า ทะเล หรือเตาผิง ตั้งเวลาหยุดอัตโนมัติ และเปิดนาฬิกาบนเดสก์ท็อปไว้"
    free: "เสียงบางส่วนใช้ฟรี เสียงพรีเมียมบางส่วนต้องซื้อ"
    limits: "เสียงพรีเมียมยังล็อกอยู่จนกว่าจะซื้อ แอปนี้เน้นเสียงบรรยากาศ ไม่ใช่คลังเพลงเต็มรูปแบบ"
  cpu-monitor:
    audience: "สำหรับผู้ใช้ Android ที่ต้องการค่า CPU, RAM และแบตเตอรี่แบบเรียลไทม์ โดยเฉพาะตอนเล่นเกมหรือใช้แอปหนัก"
    usage: "ดูอุณหภูมิ ความถี่ CPU และการใช้ multicore วิเคราะห์กราฟย้อนหลัง ใช้หน้าต่างลอยและวิดเจ็ต แล้วตั้งการแจ้งเตือนความร้อนเกิน"
    free: "ราคาปัจจุบันและการซื้อในแอปแสดงอยู่ในหน้าสโตร์"
    limits: "แอปทำหน้าที่ตรวจสอบและแจ้งเตือนเท่านั้น การลดอุณหภูมิต้องปิดแอปที่ใช้ทรัพยากรสูง"
  only-clock:
    audience: "สำหรับผู้ที่ต้องการนาฬิกาพลิกแบบเต็มจอไว้ข้างเตียง บนโต๊ะ หรือใช้มือถือและ iPad ที่ไม่ได้ใช้แล้ว"
    usage: "เปิดนาฬิกาพลิกเต็มจอ เพิ่มวิดเจ็ตนาฬิกา เปิด white noise เพื่อโฟกัส และสลับระหว่าง 12/24 ชั่วโมงกับวันที่"
    free: "ราคาปัจจุบันและการซื้อในแอปแสดงอยู่ในหน้าสโตร์"
    limits: "ใช้ได้ทั้ง Android และ iOS ต้องปล่อยอุปกรณ์ให้ทำงานต่อเนื่องเพื่อใช้เป็นจอแสดงนาฬิกา"
  meow-mood-diary:
    audience: "สำหรับผู้ที่ให้ความสำคัญกับความเป็นส่วนตัวและต้องการจดอารมณ์อย่างรวดเร็วโดยไม่ต้องเขียนยาว"
    usage: "แตะไอคอนอารมณ์เพื่อบันทึกครั้งเดียว เพิ่มบันทึกรายละเอียดและความกตัญญูเมื่อต้องการ ดูประวัติและสถิติ แล้วตั้งการแจ้งเตือนรายวัน"
    free: "ราคาปัจจุบันและการซื้อในแอปแสดงอยู่ในหน้าสโตร์"
    limits: "บันทึกไม่ถูกอัปโหลดไปยังเซิร์ฟเวอร์ของเรา และสำรองไปยัง Google Drive ของคุณเองเท่านั้น"
  system-monitor:
    audience: "สำหรับผู้ใช้ Android ที่ต้องการข้อมูลฮาร์ดแวร์แบบอ่านอย่างเดียว ไม่ใช่กลวิธีล้างขยะหรือเร่ง RAM"
    usage: "ตรวจอุณหภูมิและความถี่ CPU การใช้พื้นที่เก็บข้อมูลและหน่วยความจำ สุขภาพและแรงดันแบตเตอรี่ โหมดประหยัดพลังงาน และการแจ้งเตือนความร้อนเกิน"
    free: "System Monitor เป็นเครื่องมือ Android แบบเสียเงิน ราคาปัจจุบันแสดงอยู่ในหน้าสโตร์"
    limits: "ไม่ล้างขยะ และไม่ปลดปล่อยหรือเร่ง RAM แสดงเฉพาะสภาพอุปกรณ์ที่เป็นจริง"
