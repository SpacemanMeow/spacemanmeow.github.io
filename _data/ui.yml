  home_intro_points_h: "为什么大家会用"
  home_intro_p1: "Meow Apps Studio 的应用无需注册账号，数据默认保存在用户自己的设备上。"
  home_intro_p2: "One Widget 内置 500+ 桌面小组件，喵窝习惯提供 500+ 图标，喵窝记账提供 400+ 图标；每款应用专注一个用途，不捆绑用不到的附加功能。"
  home_intro_p3: "核心功能免费，无需订阅即可开始使用。"
  home_intro_end: "点击上方列表中的任一应用，可查看功能介绍、截图与下载链接。"
  home_faq_q1: "Meow Apps Studio 的应用免费吗？"
  home_faq_a1: "免费。Meow Apps Studio 旗下所有应用均可免费下载使用，无需订阅。部分应用提供可选的付费扩展，并在应用内明确标注。"
  home_faq_q2: "应用需要注册账号吗？"
  home_faq_a2: "不需要。这些应用默认把数据保存在你的设备上，安装后即可直接使用。"
  home_faq_q3: "支持哪些 Android 版本？"
  home_faq_a3: "应用面向较新的 Android 版本，并在主流手机与平板上测试。具体最低版本请查看各应用在 Google Play 的页面。"
  home_faq_q4: "有 iPhone 或 iPad 版本吗？"
  home_faq_a4: "这些应用主要为 Android 开发。若某款应用提供 iOS 版本，会在其详情页与页脚商店按钮中给出链接。"
  home_faq_q5: "如何导出我的数据？"
  home_faq_a5: "不同应用的导出与备份方式不同，各应用页均有说明。例如记账应用在设置中提供 CSV 导出。"
  home_faq_q6: "遇到问题如何反馈？"
  term_faq_q1: "这个术语有什么用？"
  term_faq_a1: "该术语描述 Meow 应用及其指南中使用的概念。上文以通俗语言解释，并链接到实际应用或手册供你实践。"
  term_faq_q2: "在应用里哪里能看到它？"
  term_faq_a2: "打开上方链接的应用或指南可查看真实例子。若该术语没有关联应用，它解释的是平台或系统功能，而非应用内设置。"
  release_faq_q1: "这个版本改了什么？"
  release_faq_a1: "下方每条记录对应一个版本的变更，包括修复与新功能，日期遵循应用商店的发布日期。"
  release_faq_q2: "我必须更新吗？"
  release_faq_a2: "更新是可选的，但建议安装：其中含问题修复与兼容性改进。可通过上方商店链接更新。"
  home_faq_a6: "可通过页脚邮箱联系工作室。FAQ 中心与各应用页也汇总了常见问题及直接答案。"
  meow_intro_p1: "Meow 系列应用无需注册账号，数据默认保存在用户自己的设备上。"
  meow_intro_p2: "每款 Meow 应用专注一个用途，配有手绘猫咪插画与柔和粉彩配色。"
  meow_intro_p3: "Meow 系列的核心功能免费，无需订阅即可开始使用。"
  meow_faq_q1: "Meow 系列应用免费吗？"
  meow_faq_a1: "免费。Meow 系列全部应用均可免费下载使用，无需订阅。部分应用提供可选的付费扩展，并在应用内明确标注。"
  meow_faq_q2: "Meow 应用需要注册账号吗？"
  meow_faq_a2: "不需要。Meow 记账、Meow 心情日记等应用默认把数据保存在你的设备上，安装后即可直接使用。"
  meow_faq_q4: "Meow 应用有 iPhone 或 iPad 版本吗？"
  meow_faq_a4: "Meow 系列主要为 Android 开发。若某款应用提供 iOS 版本，会在其详情页与页脚商店按钮中给出链接。"
  meow_faq_q5: "如何导出 Meow 应用里的数据？"
  meow_faq_a5: "Meow 记账在设置中提供 CSV 导出；其他 Meow 应用各有导出或备份方式，详见对应应用页。"
