  home_intro_points_h: "ทำไมคนถึงใช้"
  home_intro_p1: "แอป Meow Apps Studio ไม่ต้องมีบัญชี ข้อมูลเก็บบนอุปกรณ์ของคุณตามค่าเริ่มต้น"
  home_intro_p2: "One Widget มีวิดเจ็ตหน้าจอหลัก 500+ แบบ Meow Habits มีไอคอน 500+ แบบ และ Meow Money Manager มี 400+ แบบ แต่ละแอปโฟกัสงานเดียว ไม่รวมฟีเจอร์เสริมที่ไม่ได้ใช้"
  home_intro_p3: "ฟีเจอร์หลักฟรี ไม่ต้องสมัครสมาชิกเพื่อเริ่มใช้งาน"
  home_intro_end: "คลิกแอปใดแอปหนึ่งในรายการด้านบนเพื่อดูฟีเจอร์ ภาพหน้าจอ และลิงก์ดาวน์โหลด"
  home_faq_q1: "แอป Meow Apps Studio ใช้ฟรีหรือไม่?"
  home_faq_a1: "ใช่ ทุกแอปของ Meow Apps Studio ดาวน์โหลดและใช้งานได้ฟรีโดยไม่ต้องสมัครสมาชิก บางแอปมีตัวเลือกเสียเงินที่ระบุชัดเจนในแอป"
  home_faq_q2: "แอปต้องมีบัญชีหรือไม่?"
  home_faq_a2: "ไม่ต้องมีบัญชี แอปเก็บข้อมูลบนอุปกรณ์ของคุณตามค่าเริ่มต้น จึงใช้งานได้ทันทีหลังติดตั้ง"
  home_faq_q3: "รองรับ Android เวอร์ชันใดบ้าง?"
  home_faq_a3: "แอปตั้งเป้า Android เวอร์ชันใหม่และทดสอบบนมือถือและแท็บเล็ตปัจจุบัน ดูเวอร์ชันขั้นต่ำที่แน่ชัดได้จากหน้าแอปใน Google Play"
  home_faq_q4: "มีเวอร์ชัน iPhone หรือ iPad หรือไม่?"
  home_faq_a4: "แอปส่วนใหญ่สร้างสำหรับ Android หากมีเวอร์ชัน iOS จะมีลิงก์ในหน้าแอปและปุ่มร้านค้าที่ส่วนท้าย"
  home_faq_q5: "จะส่งออกข้อมูลได้อย่างไร?"
  home_faq_a5: "ตัวเลือกส่งออกและสำรองข้อมูลต่างกันตามแต่ละแอป อธิบายไว้ในหน้าแอป เช่น แอปการเงินมีการส่งออก CSV ในเมนูตั้งค่า"
  home_faq_q6: "จะถามหรือแจ้งปัญหาได้ที่ไหน?"
  term_faq_q1: "คำศัพท์นี้ใช้สำหรับอะไร?"
  term_faq_a1: "คำศัพท์นี้อธิบายแนวคิดที่ใช้ในแอปและคู่มือ Meow ส่วนด้านบนอธิบายอย่างเข้าใจง่ายและมีลิงก์ไปยังแอปหรือคู่มือที่ใช้งานจริง"
  term_faq_q2: "จะดูคำศัพท์นี้ได้ที่ไหนในแอป?"
  term_faq_a2: "เปิดแอปหรือคู่มือที่ลิงก์ด้านบนเพื่อดูตัวอย่างจริง หากไม่มีแอปที่เกี่ยวข้อง คำศัพท์นี้อธิบายฟีเจอร์ของแพลตฟอร์มหรือระบบ ไม่ใช่การตั้งค่าในแอป"
  release_faq_q1: "เวอร์ชันนี้เปลี่ยนอะไรบ้าง?"
  release_faq_a1: "แต่ละรายการด้านล่างระบุการเปลี่ยนแปลงของหนึ่งเวอร์ชัน รวมถึงการแก้ไขและฟีเจอร์ใหม่ วันที่ตรงกับวันอัปเดตในสโตร์"
  release_faq_q2: "ต้องอัปเดตหรือไม่?"
  release_faq_a2: "การอัปเดตไม่บังคับแต่แนะนำ เพราะมีการแก้ไขและปรับปรุงความเข้ากันได้ ติดตั้งผ่านลิงก์สโตร์ด้านบน"
  home_faq_a6: "ใช้ลิงก์อีเมลที่ส่วนท้ายเพื่อติดต่อสตูดิโอ ศูนย์ FAQ และหน้าแอปยังรวมคำถามที่พบบ่อยพร้อมคำตอบไว้ด้วย"
  meow_intro_p1: "แอป Meow ไม่ต้องมีบัญชี ข้อมูลเก็บบนอุปกรณ์ของคุณตามค่าเริ่มต้น"
  meow_intro_p2: "แอป Meow แต่ละตัวโฟกัสงานเดียว พร้อมภาพแมววาดมือและสีพาสเทลอ่อนนุ่ม"
  meow_intro_p3: "ฟีเจอร์หลักของแอป Meow ฟรี ไม่ต้องสมัครสมาชิกเพื่อเริ่มใช้งาน"
  meow_faq_q1: "แอป Meow ใช้ฟรีหรือไม่?"
  meow_faq_a1: "ใช่ ทุกแอปในซีรีส์ Meow ดาวน์โหลดและใช้งานได้ฟรีโดยไม่ต้องสมัครสมาชิก บางแอปมีตัวเลือกเสียเงินที่ระบุชัดเจนในแอป"
  meow_faq_q2: "แอป Meow ต้องมีบัญชีหรือไม่?"
  meow_faq_a2: "ไม่ต้องมีบัญชี Meow Money Manager, Meow Mood Diary และแอป Meow อื่นเก็บข้อมูลบนอุปกรณ์ของคุณตามค่าเริ่มต้น"
  meow_faq_q4: "แอป Meow มีเวอร์ชัน iPhone หรือ iPad หรือไม่?"
  meow_faq_a4: "ซีรีส์ Meow สร้างสำหรับ Android เป็นหลัก หากมีเวอร์ชัน iOS จะมีลิงก์ในหน้าแอปและปุ่มร้านค้าที่ส่วนท้าย"
  meow_faq_q5: "จะส่งออกข้อมูลจากแอป Meow ได้อย่างไร?"
  meow_faq_a5: "Meow Money Manager มีการส่งออก CSV ในเมนูตั้งค่า ส่วนแอป Meow อื่นมีตัวเลือกส่งออกหรือสำรองของตัวเอง อธิบายไว้ในหน้าแอป"
