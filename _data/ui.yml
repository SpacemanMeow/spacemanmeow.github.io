  home_intro_points_h: "Kenapa orang memakainya"
  home_intro_p1: "Aplikasi Meow Apps Studio tidak memerlukan akun — data Anda tetap tersimpan di perangkat sendiri."
  home_intro_p2: "One Widget menghadirkan 500+ widget layar utama; Meow Habits memuat 500+ ikon dan Meow Money Manager 400+ ikon — setiap aplikasi fokus pada satu tugas tanpa fitur tambahan."
  home_intro_p3: "Fitur inti gratis, tanpa langganan untuk mulai menggunakan."
  home_intro_end: "Klik aplikasi apa pun dalam daftar di atas untuk melihat fitur, tangkapan layar, dan tautan unduh."
  home_faq_q1: "Apakah aplikasi Meow Apps Studio gratis?"
  home_faq_a1: "Ya. Semua aplikasi Meow Apps Studio dapat diunduh dan dipakai gratis tanpa langganan. Beberapa aplikasi menawarkan tambahan berbayar opsional yang ditandai jelas di aplikasi."
  home_faq_q2: "Apakah aplikasi perlu akun?"
  home_faq_a2: "Tidak perlu akun. Aplikasi ini menyimpan data di perangkat Anda secara default, sehingga langsung dipakai setelah instalasi."
  home_faq_q3: "Versi Android apa yang didukung?"
  home_faq_a3: "Aplikasi menargetkan versi Android modern dan diuji di ponsel serta tablet terkini. Lihat halaman masing-masing aplikasi di Google Play untuk versi minimum yang tepat."
  home_faq_q4: "Apakah tersedia untuk iPhone atau iPad?"
  home_faq_a4: "Aplikasi ini terutama dibuat untuk Android. Jika ada versi iOS, tautannya ada di halaman aplikasi dan tombol toko di footer."
  home_faq_q5: "Bagaimana mengekspor data saya?"
  home_faq_a5: "Opsi ekspor dan cadangan berbeda tiap aplikasi dan dijelaskan di halaman masing-masing. Misalnya, aplikasi keuangan menyediakan ekspor CSV di pengaturan."
  home_faq_q6: "Ke mana saya mengirim pertanyaan atau laporan masalah?"
  term_faq_q1: "Untuk apa istilah ini digunakan?"
  term_faq_a1: "Istilah ini menjelaskan konsep yang dipakai aplikasi dan panduan Meow. Bagian di atas menjelaskannya dengan bahasa sederhana dan menautkan aplikasi atau manual terkait."
  term_faq_q2: "Di mana saya melihatnya di aplikasi?"
  term_faq_a2: "Buka aplikasi atau panduan yang ditautkan di atas untuk contoh nyata. Jika tidak ada aplikasi terkait, istilah ini menjelaskan fitur platform atau sistem, bukan pengaturan dalam aplikasi."
  release_faq_q1: "Apa yang berubah di versi ini?"
  release_faq_a1: "Setiap entri di bawah mencantumkan perubahan untuk satu versi, termasuk perbaikan dan fitur baru. Tanggal mengikuti tanggal rilis di toko aplikasi."
  release_faq_q2: "Apakah saya harus memperbarui?"
  release_faq_a2: "Pembaruan bersifat opsional tetapi disarankan karena berisi perbaikan dan peningkatan kompatibilitas. Pasang melalui tautan toko di atas."
  home_faq_a6: "Gunakan tautan email di footer untuk menghubungi studio. Pusat FAQ dan halaman aplikasi juga mengumpulkan pertanyaan umum beserta jawabannya."
  meow_intro_p1: "Aplikasi Meow tidak memerlukan akun — data Anda tetap tersimpan di perangkat sendiri."
  meow_intro_p2: "Tiap aplikasi Meow fokus pada satu tugas, dengan ilustrasi kucing gambar tangan dan warna pastel lembut."
  meow_intro_p3: "Fitur inti seri Meow gratis, tanpa langganan untuk mulai menggunakan."
  meow_faq_q1: "Apakah aplikasi Meow gratis?"
  meow_faq_a1: "Ya. Semua aplikasi Meow dapat diunduh dan dipakai gratis tanpa langganan. Beberapa aplikasi menawarkan tambahan berbayar opsional yang ditandai jelas di aplikasi."
  meow_faq_q2: "Apakah aplikasi Meow perlu akun?"
  meow_faq_a2: "Tidak perlu akun. Meow Money Manager, Meow Mood Diary, dan aplikasi Meow lainnya menyimpan data di perangkat Anda secara default."
  meow_faq_q4: "Apakah aplikasi Meow tersedia untuk iPhone atau iPad?"
  meow_faq_a4: "Seri Meow terutama dibuat untuk Android. Jika ada versi iOS, tautannya ada di halaman aplikasi dan tombol toko di footer."
  meow_faq_q5: "Bagaimana mengekspor data dari aplikasi Meow?"
  meow_faq_a5: "Meow Money Manager menyediakan ekspor CSV di pengaturan. Aplikasi Meow lainnya punya opsi ekspor atau cadangan masing-masing, dijelaskan di halaman aplikasi."

