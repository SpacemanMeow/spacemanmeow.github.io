  home_faq_q1: "Are Meow Apps Studio apps free?"
  home_faq_a1: "Yes. Every app from Meow Apps Studio is free to download and use, with no subscription required. Some apps offer optional paid extras, clearly marked in the app."
  home_faq_q2: "Do the apps need an account?"
  home_faq_a2: "No account is required. These apps keep your data on your device by default, so you can use them straight after installation."
  home_faq_q3: "Which Android versions are supported?"
  home_faq_a3: "The apps target modern Android versions and are tested on current phones and tablets. Check each app page on Google Play for the exact minimum version."
  home_faq_q4: "Are the apps available on iPhone or iPad?"
  home_faq_a4: "The portfolio is primarily built for Android. Where an iOS version exists, it is linked from the individual app page and the footer store buttons."
  home_faq_q5: "How do I export my data?"
  home_faq_a5: "Export and backup options vary by app; each app page describes what is available. For example, the money manager includes CSV export in its settings."
  home_faq_q6: "Where can I get help or report a problem?"
  term_faq_q1: "What is this term used for?"
  term_faq_a1: "This term describes a concept used by the Meow apps and their guides. The sections above explain it in plain language and link to the app or manual that puts it into practice."
  term_faq_q2: "Where can I see it in the apps?"
  term_faq_a2: "Open the linked app or guide above for a real example. If this term has no linked app, it explains a platform or system feature rather than an in-app setting."
  release_faq_q1: "What changed in this version?"
  release_faq_a1: "Each entry below lists the changes for one version, including fixes and new features. Dates follow the app store release date."
  release_faq_q2: "Do I need to update?"
  release_faq_a2: "Updates are optional but recommended: they include fixes and compatibility improvements. Install them from the store link above."
  home_faq_a6: "Use the email link in the footer to reach the studio. The FAQ hub and each app page also collect common questions with direct answers."
  meow_intro_p1: "Every Meow app needs no account — your data stays on your own device by default."
  meow_intro_p2: "Each Meow app focuses on one task, with hand-drawn cat art and soft pastel colors."
  meow_intro_p3: "Core features in the Meow series are free, with no subscription needed to start."
  meow_faq_q1: "Are the Meow apps free?"
  meow_faq_a1: "Yes. Every app in the Meow series is free to download and use, with no subscription required. Some apps offer optional paid extras, clearly marked in the app."
  meow_faq_q2: "Do the Meow apps need an account?"
  meow_faq_a2: "No account is required. Meow Money Manager, Meow Mood Diary and the other Meow apps keep your data on your device by default."
  meow_faq_q4: "Are the Meow apps on iPhone or iPad?"
  meow_faq_a4: "The Meow series is primarily built for Android. Where an iOS version exists, it is linked from the individual app page and the footer store buttons."
  meow_faq_q5: "How do I export my data from a Meow app?"
  meow_faq_a5: "Meow Money Manager includes CSV export in its settings. Other Meow apps offer their own export or backup options, described on each app page."
