  home_faq_title: "Soalan lazim"
  home_faq_more: "Lebih banyak soalan lazim"
  home_intro_points_h: "Kenapa orang menggunakannya"
  home_intro_p1: "Aplikasi Meow Apps Studio tidak memerlukan akaun — data anda kekal disimpan pada peranti sendiri."
  home_intro_p2: "One Widget memuat 500+ widget skrin utama; Meow Habits mempunyai 500+ ikon dan Meow Money Manager 400+ ikon — setiap aplikasi fokus pada satu tugas tanpa ciri tambahan."
  home_intro_p3: "Ciri teras percuma, tiada langganan untuk mula menggunakan."
  home_intro_end: "Klik mana-mana aplikasi dalam senarai di atas untuk melihat ciri, tangkapan skrin, dan pautan muat turun."
  home_faq_q1: "Adakah aplikasi Meow Apps Studio percuma?"
  home_faq_a1: "Ya. Semua aplikasi Meow Apps Studio boleh dimuat turun dan digunakan secara percuma tanpa langganan. Sesetengah aplikasi menawarkan tambahan berbayar pilihan yang ditandakan jelas dalam aplikasi."
  home_faq_q2: "Adakah aplikasi memerlukan akaun?"
  home_faq_a2: "Tiada akaun diperlukan. Aplikasi ini menyimpan data pada peranti anda secara lalai, jadi boleh terus digunakan selepas pemasangan."
  home_faq_q3: "Versi Android apa yang disokong?"
  home_faq_a3: "Aplikasi menyasarkan versi Android moden dan diuji pada telefon serta tablet semasa. Semak halaman setiap aplikasi di Google Play untuk versi minimum yang tepat."
  home_faq_q4: "Adakah tersedia untuk iPhone atau iPad?"
  home_faq_a4: "Aplikasi ini terutamanya dibina untuk Android. Jika versi iOS tersedia, pautannya ada di halaman aplikasi dan butang kedai di footer."
  home_faq_q5: "Bagaimana saya mengeksport data?"
  home_faq_a5: "Pilihan eksport dan sandaran berbeza mengikut aplikasi dan diterangkan di halaman masing-masing. Contohnya, aplikasi kewangan menyediakan eksport CSV dalam tetapan."
  home_faq_q6: "Ke mana saya hantar soalan atau laporan masalah?"
  term_faq_q1: "Untuk apa istilah ini digunakan?"
  term_faq_a1: "Istilah ini menerangkan konsep yang digunakan oleh aplikasi dan panduan Meow. Bahagian atas menjelaskannya dengan bahasa mudah dan memautkan aplikasi atau manual berkaitan."
  term_faq_q2: "Di mana saya melihatnya dalam aplikasi?"
  term_faq_a2: "Buka aplikasi atau panduan yang dipautkan di atas untuk contoh sebenar. Jika tiada aplikasi berkaitan, istilah ini menerangkan ciri platform atau sistem, bukan tetapan dalam aplikasi."
  release_faq_q1: "Apa yang berubah dalam versi ini?"
  release_faq_a1: "Setiap entri di bawah menyenaraikan perubahan untuk satu versi, termasuk pembetulan dan ciri baharu. Tarikh mengikut tarikh keluaran di kedai aplikasi."
  release_faq_q2: "Adakah saya perlu mengemas kini?"
  release_faq_a2: "Kemas kini adalah pilihan tetapi disyorkan kerana mengandungi pembetulan dan peningkatan keserasian. Pasang melalui pautan kedai di atas."
  home_faq_a6: "Gunakan pautan e-mel di footer untuk menghubungi studio. Pusat FAQ dan halaman aplikasi juga mengumpulkan soalan lazim beserta jawapan."
  meow_intro_p1: "Aplikasi Meow tidak memerlukan akaun — data anda kekal disimpan pada peranti sendiri."
  meow_intro_p2: "Setiap aplikasi Meow fokus pada satu tugas, dengan ilustrasi kucing lukisan tangan dan warna pastel lembut."
  meow_intro_p3: "Ciri teras siri Meow percuma, tiada langganan untuk mula menggunakan."
  meow_faq_q1: "Adakah aplikasi Meow percuma?"
  meow_faq_a1: "Ya. Semua aplikasi Meow boleh dimuat turun dan digunakan secara percuma tanpa langganan. Sesetengah aplikasi menawarkan tambahan berbayar pilihan yang ditandakan jelas dalam aplikasi."
  meow_faq_q2: "Adakah aplikasi Meow memerlukan akaun?"
  meow_faq_a2: "Tiada akaun diperlukan. Meow Money Manager, Meow Mood Diary dan aplikasi Meow lain menyimpan data pada peranti anda secara lalai."
  meow_faq_q4: "Adakah aplikasi Meow tersedia untuk iPhone atau iPad?"
  meow_faq_a4: "Siri Meow terutamanya dibina untuk Android. Jika versi iOS tersedia, pautannya ada di halaman aplikasi dan butang kedai di footer."
  meow_faq_q5: "Bagaimana saya mengeksport data dari aplikasi Meow?"
  meow_faq_a5: "Meow Money Manager menyediakan eksport CSV dalam tetapan. Aplikasi Meow lain mempunyai pilihan eksport atau sandaran sendiri, diterangkan di halaman aplikasi."

