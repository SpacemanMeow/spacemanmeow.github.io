name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build multilingual site (EN at root + /zh/)
        run: bash scripts/build.sh
        env:
          JEKYLL_ENV: "production"
          SITE_URL: "https://spacemanmeow.com"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout (for IndexNow key file)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ping IndexNow (Bing / ChatGPT fast indexing)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          keyfile = "indexnow-key.txt"
          key = open(keyfile).read().strip()
          sm = urllib.request.urlopen("https://spacemanmeow.com/sitemap.xml", timeout=30).read().decode()
          urls = []
          for part in sm.split("<loc>")[1:]:
              u = part.split("</loc>")[0].strip()
              if u.startswith("http"):
                  urls.append(u)
          payload = {
              "host": "spacemanmeow.com",
              "key": key,
              "keyLocation": "https://spacemanmeow.com/" + keyfile,
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print("IndexNow OK: submitted %d URLs, HTTP %d" % (len(urls), resp.status))
          except urllib.error.HTTPError as e:
              print("IndexNow HTTPError %d: %s" % (e.code, e.read().decode()[:300]))
          PY
