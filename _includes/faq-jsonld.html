{%- comment -%}
Shared FAQPage JSON-LD. Accepts `questions` as an array of objects with
either {q, a} (generated FAQ hub data) or {question, answer} (app front matter).
{%- endcomment -%}
{%- if include.questions and include.questions.size > 0 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in include.questions -%}
    {
      "@type": "Question",
      "name": {{ item.q | default: item.question | markdownify | strip_html | replace: '&amp;', '&' | normalize_whitespace | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.a | default: item.answer | markdownify | strip_html | replace: '&amp;', '&' | normalize_whitespace | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]
}
</script>
{%- endif -%}
