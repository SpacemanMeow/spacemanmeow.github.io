{% comment %}
  BreadcrumbList 结构化数据。
  层级规则：
    - 首页(/) 不输出
    - Meow 系列 app(/apps/ 且有 series): Home > Meow(/meow/) > App
    - 其他 app / 普通页: Home > 当前页
    - 博客文章(/posts/): Home > Blog(/blog/) > Post
{% endcomment %}
{% if page.url != "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {{ site.title | jsonify }},
      "item": "{{ site.url }}/"
    }{% if page.series and page.url contains '/apps/' %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.series | jsonify }},
      "item": "{{ site.url }}/{{ page.series | downcase }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ page.url }}"
    }{% elsif page.url contains '/posts/' %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ page.url }}"
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ page.url }}"
    }{% endif %}
  ]
}
</script>
{% endif %}
